<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet World Cup 26 — brak połączenia</title>
    <style>
        :root { --bg-base:#0b0d11; --bg-surface:#14171d; --text:#f5f5f7; --text-muted:rgba(245,245,247,0.55); --gold:#fbbf24; --accent:#e88a5b; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg-base); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; }
        .box { max-width:340px; }
        .cup { font-size:64px; margin-bottom:16px; }
        h1 { font-size:20px; font-weight:800; margin-bottom:8px; }
        p { font-size:14px; color:var(--text-muted); line-height:1.5; margin-bottom:20px; }
        button { background:var(--accent); color:var(--bg-base); border:none; font-weight:700; font-size:14px; padding:12px 24px; border-radius:12px; cursor:pointer; }
        button:active { transform:scale(0.97); }
    </style>
</head>
<body>
    <div class="box">
        <div class="cup">🏆</div>
        <h1>Brak połączenia</h1>
        <p>Bet World Cup 26 potrzebuje internetu, żeby pokazać aktualne typy i ranking. Sprawdź połączenie i spróbuj ponownie.</p>
        <button onclick="location.reload()">Spróbuj ponownie</button>
    </div>
</body>
</html>
